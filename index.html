<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coraly – Product Demo</title>

  <link rel="icon" href="https://www.coraly.ai/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://script.supademo.com/supademo.js"></script>

  <style>
    :root {
      --purple: #e85d3a;
      --pink: #f07850;
      --purple-light: #ed7358;
      --pink-light: #f29070;
      --purple-dark: #c94d2e;
      --gradient: linear-gradient(135deg, #e85d3a 0%, #f07850 100%);
      --gradient-soft: linear-gradient(135deg, rgba(232,93,58,0.12) 0%, rgba(240,120,80,0.12) 100%);
      --bg: #fffaf8;
      --surface: #ffffff;
      --text: #1a1210;
      --text-muted: #7a6860;
      --border: rgba(232, 93, 58, 0.12);
      --shadow: 0 4px 24px rgba(232, 93, 58, 0.1);
      --shadow-lg: 0 12px 48px rgba(232, 93, 58, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 48px 20px 64px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(232,93,58,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      left: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(240,120,80,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 960px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.6s ease both;
    }
    .logo img { height: 46px; }

    /* ── Headline ── */
    .headline {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.6s 0.1s ease both;
    }
    .headline h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .headline h1 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .headline p {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    /* ── Switcher tabs ── */
    .switcher-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
      animation: fadeDown 0.6s 0.2s ease both;
    }

    .switcher {
      display: inline-flex;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 5px;
      gap: 4px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .tab-btn {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 26px;
      border-radius: 44px;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .tab-btn .tab-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .tab-btn.active {
      color: white;
    }

    .tab-btn:hover:not(.active) {
      color: var(--purple);
    }

    /* Sliding pill */
    .slider-pill {
      position: absolute;
      top: 5px;
      left: 5px;
      height: calc(100% - 10px);
      border-radius: 44px;
      background: var(--gradient);
      box-shadow: 0 4px 16px rgba(232, 93, 58, 0.35);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      pointer-events: none;
    }

    /* Step badge */
    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,0.25);
      color: inherit;
      transition: background 0.3s;
    }
    .tab-btn:not(.active) .step-badge {
      background: var(--gradient-soft);
      color: var(--purple);
    }

    /* ── Demo card ── */
    .demo-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 1.5px solid var(--border);
      animation: fadeUp 0.7s 0.3s ease both;
    }

    /* Demo label strip */
    .demo-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .demo-label-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gradient);
      box-shadow: 0 0 0 3px rgba(147,51,234,0.15);
      animation: pulse 2s ease infinite;
    }
    .demo-label-text {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: opacity 0.3s;
    }
    .demo-label-tag {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--gradient-soft);
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    /* Iframe area */
    .demo-viewport {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f0ff;
    }

    .demo-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
    }

    .demo-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.4s ease;
    }

    /* Loading shimmer */
    .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(232,93,58,0.05) 0%,
        rgba(240,120,80,0.08) 50%,
        rgba(232,93,58,0.05) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
      border-radius: 12px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .shimmer.hidden { opacity: 0; }

    /* CTA */
    .cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .progress-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s, transform 0.3s;
    }
    .dot.active {
      background: var(--gradient);
      transform: scale(1.3);
      background: #e85d3a;
    }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      background: var(--gradient);
      color: white;
      border: none;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(232, 93, 58, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: 0.01em;
    }
    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232, 93, 58, 0.4);
    }
    .btn-cta:active { transform: translateY(0); }

    .btn-cta svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }
    .btn-cta:hover svg { transform: translateX(3px); }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(232,93,58,0.15); }
      50%       { box-shadow: 0 0 0 6px rgba(232,93,58,0.08); }
    }

    /* Fade transition for iframe swap */
    .fade-out { opacity: 0 !important; }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .tab-btn { padding: 10px 16px; font-size: 13px; }
      .demo-card { padding: 16px; }
      .cta-row { justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Logo -->
    <div class="logo">
      <img
        src="https://coraly.ai/_next/image?url=%2Fattached_assets%2FCoraly_Logo_1766172044588.png&w=256&q=75"
        alt="Coraly"
      />
    </div>

    <!-- Headline -->
    <div class="headline">
      <h1>Get started with <span>Coraly</span></h1>
      <p>Follow the guides below to set up and master your workflow.</p>
    </div>

    <!-- Tab Switcher -->
    <div class="switcher-wrap">
      <div class="switcher" id="switcher">
        <!-- Sliding pill background -->
        <div class="slider-pill" id="sliderPill"></div>

        <button class="tab-btn active" id="tab-0" onclick="switchTab(0)">
          <span class="step-badge">1</span>
          How to Install Coraly
        </button>
        <button class="tab-btn" id="tab-1" onclick="switchTab(1)">
          <span class="step-badge">2</span>
          How to Use Coraly
        </button>
      </div>
    </div>

    <!-- Demo Card -->
    <div class="demo-card">
      <div class="demo-label">
        <div class="demo-label-dot"></div>
        <span class="demo-label-text" id="demoLabelText">Installation Guide</span>
        <span class="demo-label-tag" id="demoLabelTag">Step 1 of 2</span>
      </div>

      <div class="demo-viewport">
        <div class="shimmer" id="shimmer"></div>
        <div class="demo-frame-wrap">
          <iframe
            id="demoIframe"
            src="https://app.supademo.com/embed/cmk2l4p8439jjgmn8nkll8g96?embed_v=2&utm_source=embed"
            loading="lazy"
            title="How to Install Coraly"
            allow="clipboard-write"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div class="cta-row">
        <div class="progress-dots">
          <div class="dot active" id="dot-0"></div>
          <div class="dot" id="dot-1"></div>
        </div>

        <a href="https://www.coraly.ai" target="_blank" class="btn-cta">
          Try Coraly Now
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

  </div>

  <script>
    // ─── Config ───────────────────────────────────────────────
    const demos = [
      {
        src:   'https://app.supademo.com/embed/cmk2l4p8439jjgmn8nkll8g96?embed_v=2&utm_source=embed',
        title: 'How to Install Coraly',
        label: 'Installation Guide',
        tag:   'Step 1 of 2',
      },
      {
        src:   'https://app.supademo.com/embed/cmnekpp9900u7xq0j03bzw08f?embed_v=2&utm_source=embed',
        title: 'How to Use Coraly',
        label: 'Usage Guide',
        tag:   'Step 2 of 2',
      },
    ];

    let current = 0;

    // ─── Pill positioning ─────────────────────────────────────
    function positionPill(index) {
      const pill  = document.getElementById('sliderPill');
      const btn   = document.getElementById('tab-' + index);
      const wrap  = document.getElementById('switcher');
      const wRect = wrap.getBoundingClientRect();
      const bRect = btn.getBoundingClientRect();
      pill.style.width  = bRect.width  + 'px';
      pill.style.transform = `translateX(${bRect.left - wRect.left - 5}px)`;
    }

    // ─── Switch handler ───────────────────────────────────────
    function switchTab(index) {
      if (index === current) return;
      current = index;

      // Update tab states
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      // Move pill
      positionPill(index);

      // Update dots
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === index);
      });

      // Update label
      document.getElementById('demoLabelText').textContent = demos[index].label;
      document.getElementById('demoLabelTag').textContent  = demos[index].tag;

      // Swap iframe with fade
      const iframe  = document.getElementById('demoIframe');
      const shimmer = document.getElementById('shimmer');

      iframe.classList.add('fade-out');
      shimmer.classList.remove('hidden');

      setTimeout(() => {
        iframe.src   = demos[index].src;
        iframe.title = demos[index].title;
        iframe.classList.remove('fade-out');
        iframe.onload = () => shimmer.classList.add('hidden');
      }, 300);
    }

    // ─── Init pill on load ────────────────────────────────────
    window.addEventListener('load', () => {
      positionPill(0);
      // Hide shimmer once first iframe loads
      const iframe  = document.getElementById('demoIframe');
      const shimmer = document.getElementById('shimmer');
      iframe.onload = () => shimmer.classList.add('hidden');
    });

    // Reposition pill on resize
    window.addEventListener('resize', () => positionPill(current));
  </script>
</body>
</html>
